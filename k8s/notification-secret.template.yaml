# NOTE: This file documents the Secret's shape only and is safe to commit.
# The actual SMTP_USER/SMTP_PASS values are NOT stored here — unlike
# clinic-secret (which holds a disposable local dev DB password), this
# Secret holds a real Gmail App Password tied to a personal account, so it
# is created imperatively instead of applied from a file with real values:
#
#   kubectl create secret generic notification-secret \
#     --from-literal=SMTP_USER=$SMTP_USER \
#     --from-literal=SMTP_PASS=$SMTP_PASS
#
# (with SMTP_USER / SMTP_PASS exported from the project's local .env file,
# which is gitignored)
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
type: Opaque
stringData:
  SMTP_USER: "REPLACE_VIA_KUBECTL_CREATE_SECRET_NOT_HERE"
  SMTP_PASS: "REPLACE_VIA_KUBECTL_CREATE_SECRET_NOT_HERE"
