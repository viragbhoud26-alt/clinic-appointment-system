services:
  app:
    build: .
    container_name: clinic-app
    ports:
      - "3000:3000"
    environment:
      DB_USER: clinicuser
      DB_PASSWORD: clinicpass123
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clinicdb
      SESSION_SECRET: a-long-random-string-change-this
    depends_on:
      db-seed:
        condition: service_completed_successfully

  db:
    image: postgres:16
    container_name: clinic-postgres
    environment:
      POSTGRES_USER: clinicuser
      POSTGRES_PASSWORD: clinicpass123
      POSTGRES_DB: clinicdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicuser -d clinicdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    container_name: clinic-flyway
    command: -url=jdbc:postgresql://db:5432/clinicdb -user=clinicuser -password=clinicpass123 -connectRetries=10 migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  db-seed:
    image: postgres:16
    container_name: clinic-db-seed
    entrypoint: ["psql", "postgresql://clinicuser:clinicpass123@db:5432/clinicdb", "-f", "/seed/01-init.sql"]
    volumes:
      - ./db/init:/seed
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  pgdata:
